[tool.ruff]
line-length = 100
extend-exclude = ["lab04-ai-coding-ux", "pricing_legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "*/lab04-ai-coding-ux/*",
    "*/lab-05-handout-code/*",
    "*/tests/*",
    "*/pricing_legacy.py",
]
